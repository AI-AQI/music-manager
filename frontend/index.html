<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪辑音乐库</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 44 44" role="presentation">
                    <path d="M8 24h4V13H8v11Zm8 7h4V7h-4v24Zm8 6h4V16h-4v21Zm8-9h4V11h-4v17Z"/>
                </svg>
            </div>
            <div>
                <div class="brand-title">声场档案</div>
                <div class="brand-subtitle">CUT &amp; CUE · SOUND LIBRARY</div>
            </div>
        </div>

        <div class="top-actions">
            <div class="studio-status"><span></span> LOCAL ARCHIVE</div>
            <div class="theme-switcher">
                <button
                    id="themeToggleBtn"
                    class="theme-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="themeMenu"
                >
                    <span class="theme-toggle-swatch" aria-hidden="true"></span>
                    <span id="themeToggleLabel">档案室</span>
                    <span class="theme-toggle-chevron" aria-hidden="true">⌄</span>
                </button>
                <div id="themeMenu" class="theme-menu hidden" role="menu" aria-label="选择界面主题">
                    <div class="theme-menu-label">APPEARANCE</div>
                    <button class="theme-option" type="button" role="menuitemradio" data-theme="archive" aria-checked="true">
                        <span class="theme-preview archive-preview" aria-hidden="true"><i></i><i></i><i></i></span>
                        <span><strong>档案室</strong><small>暖纸、墨黑、朱红</small></span>
                        <b aria-hidden="true">✓</b>
                    </button>
                    <button class="theme-option" type="button" role="menuitemradio" data-theme="sky" aria-checked="false">
                        <span class="theme-preview sky-preview" aria-hidden="true"><i></i><i></i><i></i></span>
                        <span><strong>云雾</strong><small>天青、雾白、暮紫</small></span>
                        <b aria-hidden="true">✓</b>
                    </button>
                </div>
            </div>
            <button id="importBtn" class="primary-btn">
                <span class="button-index">01</span> 导入曲目
            </button>
        </div>
    </header>


    <div class="main">

        <!-- 左侧 -->
        <aside class="sidebar">

            <div class="sidebar-section">
                <div class="sidebar-title">音乐库</div>

                <button class="nav-item active" data-view="all">
                    <span>♫</span>
                    <span>全部音乐</span>
                    <span class="nav-count" id="allCount">0</span>
                </button>

                <button class="nav-item" data-view="clips">
                    <span>◈</span>
                    <span>音乐片段</span>
                    <span class="nav-count" id="clipCount">0</span>
                </button>

                <button class="nav-item" data-view="recent">
                    <span>◷</span>
                    <span>最近添加</span>
                </button>
            </div>


            <div class="sidebar-section">
                <div class="sidebar-title">
                    分类
                </div>

                <button class="nav-item" data-view="albums">
                    <span>▣</span>
                    <span>专辑</span>
                </button>

            </div>


            <div class="sidebar-section tag-section">
                <div class="sidebar-title">
                    常用 Tag
                </div>

                <div id="sidebarTags" class="sidebar-tags">
                    <div class="empty-small">暂无 Tag</div>
                </div>
            </div>

        </aside>


        <!-- 主区域 -->
        <main class="content">

            <!-- 工具栏 -->
            <div class="toolbar">

                <div class="search-box">
                    <span class="search-mark" aria-hidden="true"></span>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="搜索音乐名称、专辑、Tag..."
                    >
                    <button id="clearSearch" class="clear-search">×</button>
                    <span class="search-key" aria-hidden="true">/ </span>
                </div>

                <div class="view-buttons">
                    <button class="view-btn active" data-layout="list" title="列表视图" aria-label="列表视图">
                        ☰
                    </button>
                    <button class="view-btn" data-layout="grid" title="网格视图" aria-label="网格视图">
                        ▦
                    </button>
                </div>

                <button id="filterToggleBtn" class="secondary-btn toolbar-btn" aria-expanded="false">
                    ⌘ 筛选
                </button>

                <button id="selectionToggleBtn" class="secondary-btn toolbar-btn">
                    选择
                </button>

                <button id="rowPlayToggleBtn" class="secondary-btn toolbar-btn" aria-pressed="true">
                    点击试听：开
                </button>

            </div>

            <section id="filterPanel" class="filter-panel hidden" aria-label="标签筛选">
                <div class="filter-panel-header">
                    <div>
                        <strong>快速筛选</strong>
                        <span>可组合多个 Tag 精准找歌</span>
                    </div>
                    <div>
                        <button id="manageTagsBtn" class="text-btn">管理 Tag</button>
                        <button id="clearFiltersBtn" class="text-btn">清空筛选</button>
                    </div>
                </div>
                <div id="activeFilterTags" class="active-filter-tags"></div>
                <div id="recommendedTags" class="recommended-tags"></div>
                <div id="tagManager" class="tag-manager hidden">
                    <div class="tag-manager-heading">Tag 管理</div>
                    <div class="tag-create-row">
                        <input id="newTagName" type="text" placeholder="新 Tag 名称">
                        <select id="newTagCategory"></select>
                        <input id="newTagCustomCategory" class="hidden" placeholder="新分类名称">
                        <button id="createTagBtn" class="primary-btn">新建 Tag</button>
                        <button id="resetTagEditorBtn" class="text-btn hidden">取消</button>
                        <button id="deleteEditingTagBtn" class="text-btn hidden">删除</button>
                    </div>
                    <div id="tagManagerList" class="tag-manager-list"></div>
                </div>
            </section>

            <section id="bulkToolbar" class="bulk-toolbar hidden">
                <span id="selectionCount">已选择 0 首</span>
                <button id="selectAllVisibleBtn" class="text-btn">全选当前结果</button>
                <div class="bulk-tag-controls">
                    <input id="bulkTagInput" type="text" placeholder="输入 Tag">
                    <button id="bulkAddTagBtn" class="secondary-btn">添加 Tag</button>
                    <button id="bulkRemoveTagBtn" class="secondary-btn">移除 Tag</button>
                </div>
                <button id="exitSelectionBtn" class="text-btn">完成</button>
            </section>


            <!-- 页面标题 -->
            <div class="page-header">
                <div>
                    <div class="page-kicker">THE SOUND ARCHIVE / 2026</div>
                    <h1 id="pageTitle">全部音乐</h1>
                    <div id="pageDescription" class="page-description">
                        你的本地音乐素材
                    </div>
                </div>

                <div class="result-info" id="resultInfo">
                    0 个音乐
                </div>
            </div>


            <!-- 内容 -->
            <div id="contentArea" class="content-area">
                <!-- JS 渲染 -->
            </div>

        </main>


        <!-- 右侧详情 -->
        <aside id="detailPanel" class="detail-panel hidden">

            <div class="detail-header">
                <div class="detail-title">音乐详情</div>
                <button id="closeDetail" class="icon-btn">×</button>
            </div>

            <div id="detailContent"></div>

        </aside>

        <aside id="musicClipsPanel" class="music-clips-panel hidden">
            <div class="detail-header">
                <div>
                    <div class="detail-title">音乐片段</div>
                    <div id="musicClipsSource" class="clip-editor-source"></div>
                </div>
                <button id="closeMusicClips" class="icon-btn">×</button>
            </div>
            <div id="musicClipsBody" class="clips-panel-body"></div>
        </aside>


        <!-- 右侧候选面板 -->
        <aside id="candidatePanel" class="detail-panel hidden">

            <div class="detail-header">
                <div class="detail-title">
                    候选清单
                    <span id="candidatePanelCount" class="detail-title-count"></span>
                </div>
                <button id="closeCandidatePanel" class="icon-btn">×</button>
            </div>

            <div id="candidatePanelBody" class="detail-content"></div>

        </aside>

    </div>


    <!-- 底部播放器 -->
    <footer id="playerBar" class="player-bar hidden">

        <audio id="barAudio" preload="auto"></audio>

        <div class="player-left">

            <div class="player-icon">
                ♫
            </div>

            <div class="player-info">

                <div id="playerTitle" class="player-title">
                    未在播放
                </div>

                <div id="playerMeta" class="player-meta">
                    —
                </div>

            </div>

        </div>


        <div class="player-center">

            <button id="playerPrevBtn" class="player-btn" title="上一首">
                ⏮
            </button>

            <button id="playerPlayBtn" class="player-btn player-play" title="播放/暂停">
                ▶
            </button>

            <button id="playerNextBtn" class="player-btn" title="下一首">
                ⏭
            </button>

        </div>


        <div class="player-right">

            <input
                id="playerSeek"
                type="range"
                min="0"
                max="1000"
                value="0"
                title="进度"
            >

            <span id="playerTime" class="player-time">
                00:00 / 00:00
            </span>

            <button id="playerAddCandidateBtn" class="player-btn" title="加入候选">
                ＋
            </button>

            <button id="playerCandidatesBtn" class="player-btn" title="候选列表">
                ★
                <span id="candidateBadge" class="badge">0</span>
            </button>

            <button id="playerCloseBtn" class="player-btn" title="关闭播放器">
                ×
            </button>

        </div>

    </footer>

</div>


<!-- ============================= -->
<!-- 导入音乐弹窗 -->
<!-- ============================= -->

<div id="importModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">
            <h2>导入音乐</h2>
            <button class="icon-btn" data-close-modal>×</button>
        </div>

        <div class="modal-body">

            <div
                id="dropZone"
                class="drop-zone"
            >
                <div class="drop-icon">♫</div>

                <div class="drop-title">
                    导入本地 MP3 音乐
                </div>

                <div class="drop-description">
                    可选择多个文件夹，自动扫描其中的 MP3 文件
                </div>

                <div class="import-source-actions">
                    <button id="chooseFileBtn" class="secondary-btn">选择文件</button>
                    <button id="chooseFolderBtn" class="primary-btn">选择文件夹</button>
                </div>
            </div>

            <fieldset class="album-source-control">
                <legend>专辑识别方式</legend>
                <label><input type="radio" name="albumSource" value="metadata" checked> 以 MP3 属性为准</label>
                <label><input type="radio" name="albumSource" value="folder"> 以文件夹名称为准</label>
            </fieldset>


            <div id="selectedFiles" class="selected-files"></div>

        </div>

        <div class="modal-footer">
            <button class="secondary-btn" data-close-modal>
                取消
            </button>

            <button
                id="confirmImportBtn"
                class="primary-btn"
                disabled
            >
                导入
            </button>
        </div>

    </div>

</div>


<!-- ============================= -->
<!-- 编辑音乐弹窗 -->
<!-- ============================= -->

<div id="editModal" class="modal hidden">

    <div class="modal-box small">

        <div class="modal-header">
            <h2>编辑音乐信息</h2>
            <button class="icon-btn" data-close-modal>×</button>
        </div>

        <div class="modal-body">

            <input type="hidden" id="editMusicId">

            <label>
                音乐名称
                <input id="editName" type="text">
            </label>

            <label>
                专辑
                <input id="editAlbum" type="text">
            </label>

            <label>
                Tag
                <div id="editTags" class="tag-editor"></div>

                <div class="tag-input-row">
                    <input
                        id="editTagInput"
                        type="text"
                        placeholder="输入新 Tag"
                    >
                    <button id="addEditTagBtn" class="secondary-btn">
                        添加
                    </button>
                </div>
            </label>

        </div>

        <div class="modal-footer">

            <button class="secondary-btn" data-close-modal>
                取消
            </button>

            <button id="saveEditBtn" class="primary-btn">
                保存
            </button>

        </div>

    </div>

</div>


<!-- Tag 管理操作浮层 -->
<div id="tagActionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tagActionTitle">

    <div class="modal-box small">

        <div class="modal-header">
            <h2 id="tagActionTitle">编辑 Tag</h2>
            <button id="closeTagAction" class="icon-btn" type="button" aria-label="关闭">×</button>
        </div>

        <div class="modal-body">
            <label id="tagActionNameLabel">
                <span id="tagActionNameText">Tag 名称</span>
                <input id="tagActionName" type="text" autocomplete="off">
            </label>
            <label id="tagActionCategoryLabel" class="hidden">
                分类
                <select id="tagActionCategory"></select>
            </label>
            <p id="tagActionHint" class="form-hint"></p>
        </div>

        <div class="modal-footer">
            <button id="cancelTagAction" class="secondary-btn" type="button">取消</button>
            <button id="saveTagAction" class="primary-btn" type="button">保存</button>
        </div>

    </div>

</div>


<!-- ============================= -->
<!-- 新建片段 -->
<!-- ============================= -->

<div id="clipEditorPanel" class="clip-editor-overlay hidden" role="dialog" aria-modal="true" aria-label="音乐片段编辑器">
<aside class="clip-editor-panel">

    <div class="clip-editor-header">
        <div>
            <div id="clipEditorTitle" class="detail-title">新建音乐片段</div>
            <div id="clipEditorMusicName" class="clip-editor-source"></div>
        </div>
        <button id="closeClipEditor" class="icon-btn">×</button>
    </div>

    <div class="clip-editor-body">

            <input type="hidden" id="clipMusicId">

            <div class="clip-editor-preview">
                <audio id="clipAudio"></audio>
                <button id="previewClipBtn" class="primary-btn">▶ 试听选段</button>
                <span id="clipCurrentTime" class="clip-current-time">00:00 / 00:00</span>
            </div>

            <!-- 时间轴 -->
            <div class="timeline-editor">

                <div class="timeline-buttons">
                    <button id="setStartBtn" class="secondary-btn">
                        当前时间设为开始
                    </button>

                    <button id="setEndBtn" class="secondary-btn">
                        当前时间设为结束
                    </button>
                </div>

                <div class="timeline-time">
                    <label>开始 <input id="clipStartInput" type="text" inputmode="decimal" value="00:00"></label>
                    <label>结束 <input id="clipEndInput" type="text" inputmode="decimal" value="00:00"></label>
                </div>

                <div id="timelineTrack" class="timeline-track">

                    <div id="timelinePlayhead" class="timeline-playhead"></div>

                    <div
                        id="timelineSelection"
                        class="timeline-selection"
                    >
                        <div
                            id="startHandle"
                            class="timeline-handle left"
                        ></div>

                        <div
                            id="endHandle"
                            class="timeline-handle right"
                        ></div>
                    </div>

                </div>

            </div>


            <label>
                片段名称
                <input
                    id="clipName"
                    type="text"
                    placeholder="例如：情绪渐起"
                >
            </label>


            <label>
                Tag

                <div
                    id="clipTags"
                    class="tag-editor"
                ></div>

                <div class="tag-input-row">

                    <input
                        id="clipTagInput"
                        type="text"
                        placeholder="输入新 Tag"
                    >

                    <button
                        id="addClipTagBtn"
                        class="secondary-btn"
                    >
                        添加
                    </button>

                </div>

                <div class="tag-suggestions">
                    <div class="suggestion-title">
                        已有 Tag
                    </div>

                    <div id="clipTagSuggestions"></div>
                </div>

            </label>

    </div>

    <div class="clip-editor-footer">
        <button id="cancelClipEditor" class="secondary-btn">取消</button>
        <button id="saveClipBtn" class="primary-btn">保存片段</button>
    </div>

</aside>
</div>


<!-- Toast -->
<div id="toast" class="toast"></div>


<script src="app.js"></script>

</body>
</html>
