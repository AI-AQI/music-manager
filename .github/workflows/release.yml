name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# 同一分支或 tag 只保留最新一次运行，避免重复推送 tag 时并发修改同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          tauri_version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)"

          if [[ -z "$cargo_version" || -z "$tauri_version" ]]; then
            echo "无法读取 Cargo.toml 或 tauri.conf.json 中的版本号" >&2
            exit 1
          fi

          if [[ "$cargo_version" != "$tauri_version" ]]; then
            echo "版本不一致：Cargo.toml=$cargo_version, tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" == "$tag_version" || "$tag_version" != "$cargo_version" ]]; then
              echo "版本不一致：tag=$GITHUB_REF_NAME, 应用版本=$cargo_version" >&2
              exit 1
            fi
          fi

          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

  # 按 CPU 架构分两个原生 runner 构建，避免交叉编译的坑
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建 arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          # Intel 原生构建 x64（macos-13 已退役；macos-15-intel / macos-26-intel 是当前 GA 的 Intel 标签）
          # 若将来 Intel 标签也退役，改为在 arm64 上交叉编译：rustup target add x86_64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # CI 里没有 cargo-tauri，需要单独装；版本与本地保持一致，必要时升级
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build DMG
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: src-tauri

      # 免费 ad-hoc 签名也必须覆盖整个 App；只有链接器签名的包会在这里失败。
      # 此检查验证完整性，不代表通过 Gatekeeper 或完成 Apple 公证。
      - name: Verify app signature and DMG integrity
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/声场档案.app"
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      # 关键一步：把中文名 dmg 重命名成纯 ASCII 名，再上传，避免中文在发布时被“删掉”
      - name: Rename to ASCII asset name
        id: rename
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          src_dmg="$(ls "$dmg_dir"/*.dmg | head -n 1)"
          dst="music-manager_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.dmg"
          cp "$src_dmg" "$dst"
          echo "asset=${dst}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-${{ matrix.arch }}
          path: ${{ steps.rename.outputs.asset }}
          if-no-files-found: error

  # 打 tag 时才创建 release；workflow_dispatch 只用来测试构建、不发布
  release:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            scripts/install-macos.sh
          generate_release_notes: true
          # 加了 body 后，它会被放在自动生成的 release notes 之前
          body: |
            修复旧安装包仅含可执行文件链接器签名、整个 App 签名校验失败的问题。两个 Mac 架构均使用完整的免费 ad-hoc 签名，并在发布前检查 App 签名和 DMG 完整性。

            ### 下载文件

            请根据你的 Mac 芯片下载对应的 DMG：

            | 设备 | 下载文件 |
            | --- | --- |
            | M1 / M2 / M3 / M4 等 Apple Silicon Mac | `music-manager_${{ needs.validate.outputs.version }}_aarch64.dmg` |
            | Intel Mac | `music-manager_${{ needs.validate.outputs.version }}_x64.dmg` |

            ### 安装

            安装包使用免费的 ad-hoc（临时）签名，未进行 Apple Developer ID 签名或公证。macOS 仍可能要求首次手动允许打开。

            1. 打开 DMG，将「声场档案」拖到「应用程序」。
            2. 在「应用程序」中双击「声场档案」。
            3. 若提示无法验证开发者或 Apple 无法检查，请打开「系统设置 → 隐私与安全性」，找到「声场档案」并点击「仍要打开」，再确认「打开」。以后通常可直接双击。

            「仍要打开」是否出现取决于 macOS 版本和设备策略；修复签名不代表系统会自动放行。

            ### 旧包或仍无法打开时

            若提示“已损坏”，先重新下载本 Release 的 DMG。仍无法安装时，或正在使用旧版本，可从同一个 Release 下载 `install-macos.sh`，再打开“终端”运行以下命令。不要将此脚本用于来源不明的安装包。

            Apple Silicon Mac：

            ```sh
            bash "$HOME/Downloads/install-macos.sh" "$HOME/Downloads/music-manager_${{ needs.validate.outputs.version }}_aarch64.dmg"
            ```

            Intel Mac：

            ```sh
            bash "$HOME/Downloads/install-macos.sh" "$HOME/Downloads/music-manager_${{ needs.validate.outputs.version }}_x64.dmg"
            ```

            脚本会校验 DMG、将应用复制到“应用程序”文件夹，并移除该应用的下载隔离标记。首次运行会要求输入 Mac 管理员密码。

            已有旧版本时，在命令最后加上 `--replace`：

            ```sh
            bash "$HOME/Downloads/install-macos.sh" "$HOME/Downloads/music-manager_${{ needs.validate.outputs.version }}_aarch64.dmg" --replace
            ```

            ### 注意

            - 删除音乐或片段只会移除软件中的记录，不会删除原始音频文件。
            - 当前安装脚本用于小范围测试；顺畅的正式站外分发需要 Apple Developer ID 签名与公证，首次打开仍可能有普通的下载确认提示。
          # 想先人工确认再发，就打开下面这行：
          # draft: true
          # 预发布版本（如 v0.1.0-beta.1）打开下面这行：
          # prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
